<?xml version="1.0" encoding="utf-8"?>
<svg xmlns:xlink="http://www.w3.org/1999/xlink" id="vanish-safe-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
            <defs>
              <linearGradient id="vn-bg-safe" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#F5F5F7"/>
                <stop offset="100%" stop-color="#DDDCE1"/>
              </linearGradient>
              <pattern id="vn-grid-safe" width="40" height="40" patternUnits="userSpaceOnUse">
                <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#000000" stroke-opacity="0.035" stroke-width="1"/>
              </pattern>
              <filter id="vn-window-shadow-safe" x="-10%" y="-10%" width="120%" height="120%">
                <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.18"/>
              </filter>
              <filter id="vn-red-glow-safe" x="-100%" y="-100%" width="300%" height="300%">
                <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#FF5F56" flood-opacity="0.8"/>
              </filter>
              <radialGradient id="vn-red-btn-safe" cx="35%" cy="30%" r="80%">
                <stop offset="0%" stop-color="#FF9188"/>
                <stop offset="55%" stop-color="#FF5F56"/>
                <stop offset="100%" stop-color="#C22B22"/>
              </radialGradient>
            </defs>

            <!-- Background -->
            <rect width="1200" height="400" fill="url(#vn-bg-safe)"/>
            <rect width="1200" height="400" fill="url(#vn-grid-safe)"/>

            <!-- Left text content (shifted upward to keep bottom 120px clear) -->
            <g transform="translate(80, 0)">
              <text x="0" y="60" fill="#6B6B70" font-family="ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="3">TWEAKINJECT EXCLUSIVE</text>
              <text x="0" y="110" fill="#1D1D1F" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="54" font-weight="800" letter-spacing="-1.5">Vanish</text>
              <text x="0" y="145" fill="#48484D" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="500">Windows close with a graceful 1-second shrink.</text>

              <g transform="translate(0, 185)">
                <circle cx="6" cy="10" r="3.5" fill="#FF5F56"/>
                <text x="22" y="14" fill="#2B2B2E" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">Silky 1-second shrink animation</text>

                <circle cx="6" cy="38" r="3.5" fill="#FF5F56"/>
                <text x="22" y="42" fill="#2B2B2E" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">Windows collapse toward their center</text>

                <circle cx="6" cy="66" r="3.5" fill="#FF5F56"/>
                <text x="22" y="70" fill="#2B2B2E" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">System-wide, no configuration</text>
              </g>
            </g>

            <!-- Right mockup: window shrunk into the top safe area -->
            <g transform="translate(700, 20)" filter="url(#vn-window-shadow-safe)">
              <!-- Window body (height reduced so it clears the bottom 120px overlay zone) -->
              <rect width="440" height="235" rx="12" fill="#1C1C1E" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
              <line x1="0" y1="30" x2="440" y2="30" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

              <!-- Traffic lights: highlighted red -->
              <circle cx="20" cy="15" r="17" fill="none" stroke="#FF5F56" stroke-width="1.25" stroke-dasharray="3 3" opacity="0.55"/>
              <circle cx="20" cy="15" r="24" fill="none" stroke="#FF5F56" stroke-width="1" stroke-dasharray="4 5" opacity="0.25"/>

              <g filter="url(#vn-red-glow-safe)">
                <circle cx="20" cy="15" r="7" fill="url(#vn-red-btn-safe)"/>
                <circle cx="20" cy="15" r="7" fill="none" stroke="rgba(0,0,0,0.25)" stroke-width="0.5"/>
                <ellipse cx="18" cy="12.5" rx="2.8" ry="1.4" fill="rgba(255,255,255,0.55)"/>
              </g>

              <circle cx="40" cy="15" r="5" fill="#FFBD2E"/>
              <circle cx="56" cy="15" r="5" fill="#27C93F"/>

              <!-- Cursor pointer near red button -->
              <g transform="translate(28, 22)" opacity="0.95">
                <path d="M 0 0 L 0 13 L 3.3 10 L 6 15 L 7.8 14.2 L 5 9.1 L 9.3 8.7 Z" fill="#FFFFFF" stroke="#1A1A1E" stroke-width="0.9" stroke-linejoin="round"/>
              </g>

              <!-- Sidebar -->
              <rect x="0" y="30" width="130" height="205" fill="#242427"/>
              <rect x="10" y="46" width="80" height="6" rx="3" fill="rgba(255,255,255,0.28)"/>
              <rect x="10" y="60" width="60" height="5" rx="2.5" fill="rgba(255,255,255,0.14)"/>

              <rect x="6" y="80" width="118" height="24" rx="6" fill="rgba(255,255,255,0.08)"/>
              <rect x="16" y="89" width="72" height="6" rx="3" fill="rgba(255,255,255,0.55)"/>

              <rect x="10" y="118" width="86" height="6" rx="3" fill="rgba(255,255,255,0.14)"/>
              <rect x="10" y="136" width="72" height="6" rx="3" fill="rgba(255,255,255,0.14)"/>
              <rect x="10" y="154" width="90" height="6" rx="3" fill="rgba(255,255,255,0.14)"/>
              <rect x="10" y="172" width="66" height="6" rx="3" fill="rgba(255,255,255,0.14)"/>
              <rect x="10" y="190" width="82" height="6" rx="3" fill="rgba(255,255,255,0.14)"/>

              <!-- Main content -->
              <rect x="150" y="52" width="170" height="14" rx="4" fill="rgba(255,255,255,0.42)"/>
              <rect x="150" y="74" width="110" height="8" rx="3" fill="rgba(255,255,255,0.2)"/>

              <rect x="150" y="102" width="270" height="6" rx="3" fill="rgba(255,255,255,0.12)"/>
              <rect x="150" y="116" width="250" height="6" rx="3" fill="rgba(255,255,255,0.12)"/>
              <rect x="150" y="130" width="270" height="6" rx="3" fill="rgba(255,255,255,0.12)"/>
              <rect x="150" y="144" width="200" height="6" rx="3" fill="rgba(255,255,255,0.12)"/>

              <rect x="150" y="172" width="260" height="6" rx="3" fill="rgba(255,255,255,0.12)"/>
              <rect x="150" y="186" width="240" height="6" rx="3" fill="rgba(255,255,255,0.12)"/>
              <rect x="150" y="200" width="270" height="6" rx="3" fill="rgba(255,255,255,0.12)"/>
              <rect x="150" y="214" width="180" height="6" rx="3" fill="rgba(255,255,255,0.12)"/>

              <!-- Shrink trajectory: nested dashed rectangles centered on window (220, 118) -->
              <rect x="88" y="47" width="264" height="142" rx="9" fill="none" stroke="#FF5F56" stroke-width="1.25" stroke-dasharray="4 4" opacity="0.45"/>
              <rect x="154" y="83" width="132" height="70" rx="6" fill="none" stroke="#FF5F56" stroke-width="1.5" stroke-dasharray="5 3" opacity="0.7"/>

              <!-- Vanish-point dot -->
              <circle cx="220" cy="118" r="12" fill="none" stroke="#FF5F56" stroke-width="1" opacity="0.55"/>
              <circle cx="220" cy="118" r="4.5" fill="#FF5F56"/>

              <!-- Duration tag beside vanish point -->
              <g transform="translate(232, 114)">
                <rect x="0" y="0" width="34" height="14" rx="3.5" fill="rgba(255, 95, 86, 0.15)" stroke="#FF5F56" stroke-width="0.6"/>
                <text x="17" y="10" fill="#FF5F56" font-family="ui-monospace, monospace" font-size="8" font-weight="700" letter-spacing="0.5" text-anchor="middle">1.00s</text>
              </g>
            </g>
          </svg>