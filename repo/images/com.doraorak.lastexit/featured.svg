<?xml version="1.0" encoding="utf-8"?>
<svg xmlns:xlink="http://www.w3.org/1999/xlink" id="lastexit-featured-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="le-bg-feat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F5F7"/>
      <stop offset="100%" stop-color="#DDDCE1"/>
    </linearGradient>
    <pattern id="le-grid-feat" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#000000" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="le-win-shadow-feat" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <filter id="le-red-glow-feat" x="-100%" y="-100%" width="300%" height="300%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FF3B30" flood-opacity="0.75"/>
    </filter>
    <radialGradient id="le-red-btn-feat" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#FF9188"/>
      <stop offset="55%" stop-color="#FF5F56"/>
      <stop offset="100%" stop-color="#C22B22"/>
    </radialGradient>
    <linearGradient id="le-arrow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A80"/>
      <stop offset="100%" stop-color="#FF5252"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#le-bg-feat)"/>
  <rect width="1200" height="400" fill="url(#le-grid-feat)"/>

  <!-- Left text content -->
  <g transform="translate(80, 0)">
    <text x="0" y="60" fill="#6B6B70" font-family="ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="3">TWEAKINJECT EXCLUSIVE</text>
    <text x="0" y="112" fill="#1D1D1F" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">LastExit</text>
    <text x="0" y="148" fill="#48484D" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="500">Gracefully quit apps when their last window closes.</text>

    <g transform="translate(0, 186)">
      <circle cx="6" cy="10" r="3.5" fill="#FF5F56"/>
      <text x="22" y="14" fill="#2B2B2E" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">Synchronized with Vanish close animations</text>

      <circle cx="6" cy="38" r="3.5" fill="#FF5F56"/>
      <text x="22" y="42" fill="#2B2B2E" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">Multi-tier safety: protects Finder, Dock &amp; agents</text>

      <circle cx="6" cy="66" r="3.5" fill="#FF5F56"/>
      <text x="22" y="70" fill="#2B2B2E" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">Configurable delay &amp; custom app exclusions</text>
    </g>
  </g>

  <!-- Right Mockup: Closing Window & Dock Indicator -->
  <g transform="translate(680, 24)" filter="url(#le-win-shadow-feat)">
    <!-- Window Body -->
    <rect width="450" height="235" rx="14" fill="#1C1C1E" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <line x1="0" y1="32" x2="450" y2="32" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <!-- Traffic lights -->
    <circle cx="20" cy="16" r="15" fill="none" stroke="#FF5F56" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.6"/>
    <g filter="url(#le-red-glow-feat)">
      <circle cx="20" cy="16" r="7" fill="url(#le-red-btn-feat)"/>
      <ellipse cx="18" cy="13.5" rx="2.5" ry="1.2" fill="rgba(255,255,255,0.6)"/>
    </g>
    <circle cx="40" cy="16" r="5" fill="#FFBD2E"/>
    <circle cx="56" cy="16" r="5" fill="#27C93F"/>

    <!-- Sidebar -->
    <rect x="0" y="32" width="125" height="203" fill="#232326"/>
    <rect x="12" y="48" width="75" height="6" rx="3" fill="rgba(255,255,255,0.25)"/>
    <rect x="12" y="62" width="55" height="5" rx="2.5" fill="rgba(255,255,255,0.12)"/>
    <rect x="8" y="80" width="109" height="22" rx="6" fill="rgba(255,255,255,0.08)"/>
    <rect x="16" y="88" width="65" height="6" rx="3" fill="rgba(255,255,255,0.5)"/>

    <!-- Main Content Area with Exit Flow -->
    <g transform="translate(150, 48)">
      <rect x="0" y="0" width="130" height="12" rx="4" fill="rgba(255,255,255,0.35)"/>
      <rect x="0" y="20" width="85" height="7" rx="3" fill="rgba(255,255,255,0.18)"/>

      <rect x="0" y="46" width="260" height="5" rx="2.5" fill="rgba(255,255,255,0.10)"/>
      <rect x="0" y="58" width="240" height="5" rx="2.5" fill="rgba(255,255,255,0.10)"/>
      <rect x="0" y="70" width="255" height="5" rx="2.5" fill="rgba(255,255,255,0.10)"/>

      <!-- Exit Card -->
      <g transform="translate(40, 92)">
        <rect x="0" y="0" width="180" height="58" rx="10" fill="rgba(255, 95, 86, 0.08)" stroke="#FF5F56" stroke-width="1"/>
        <circle cx="28" cy="29" r="14" fill="#FF5F56" opacity="0.15"/>
        <path d="M 22 29 L 32 29 M 28 24 L 33 29 L 28 34" fill="none" stroke="#FF5F56" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="52" y="25" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Last Window Closed</text>
        <text x="52" y="42" fill="#FF5F56" font-family="ui-monospace, monospace" font-size="10" font-weight="500">Terminating in 0.50s...</text>
      </g>
    </g>
  </g>
</svg>
