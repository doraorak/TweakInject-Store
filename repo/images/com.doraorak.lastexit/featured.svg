<?xml version="1.0" encoding="utf-8"?>
<svg xmlns:xlink="http://www.w3.org/1999/xlink" id="lastexit-featured-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="le-bg-feat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F5F7"/>
      <stop offset="100%" stop-color="#DDDCE1"/>
    </linearGradient>
    <pattern id="le-grid-feat" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#000000" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="le-win-shadow-feat" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <filter id="le-red-glow-feat" x="-100%" y="-100%" width="300%" height="300%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#FF5F56" flood-opacity="0.8"/>
    </filter>
    <filter id="le-cursor-shadow-feat" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <radialGradient id="le-red-btn-feat" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#FF9188"/>
      <stop offset="55%" stop-color="#FF5F56"/>
      <stop offset="100%" stop-color="#C22B22"/>
    </radialGradient>
    <clipPath id="le-window-clip-feat">
      <rect width="440" height="290" rx="16"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#le-bg-feat)"/>
  <rect width="1200" height="400" fill="url(#le-grid-feat)"/>

  <!-- Left text content (aligned to match Vanish art) -->
  <g transform="translate(80, 0)">
    <text x="0" y="90" fill="#6B6B70" font-family="ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="3">TWEAKINJECT EXCLUSIVE</text>
    <text x="0" y="145" fill="#1D1D1F" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="54" font-weight="800" letter-spacing="-1.5">LastExit</text>
    <text x="0" y="185" fill="#48484D" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="500">Gracefully quit apps when their last window closes.</text>

    <g transform="translate(0, 225)">
      <circle cx="6" cy="10" r="3.5" fill="#FF5F56"/>
      <text x="22" y="14" fill="#2B2B2E" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">Synchronized with Vanish close animations</text>

      <circle cx="6" cy="40" r="3.5" fill="#FF5F56"/>
      <text x="22" y="44" fill="#2B2B2E" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">Multi-tier safety: Finder, Dock &amp; background agents</text>

      <circle cx="6" cy="70" r="3.5" fill="#FF5F56"/>
      <text x="22" y="74" fill="#2B2B2E" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">Configurable delay &amp; custom app exclusions</text>
    </g>
  </g>

  <!-- Right Mockup: full height window matching Vanish (height=290, rx=16) -->
  <g transform="translate(700, 55)" filter="url(#le-win-shadow-feat)">
    <!-- Window Body -->
    <rect width="440" height="290" rx="16" fill="#1C1C1E" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

    <!-- Clipped window contents (preserves rounded corners on all edges including bottom-left) -->
    <g clip-path="url(#le-window-clip-feat)">
      <!-- Titlebar divider -->
      <line x1="0" y1="30" x2="440" y2="30" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

      <!-- Sidebar -->
      <rect x="0" y="30" width="130" height="260" fill="#242427"/>
      <rect x="10" y="46" width="80" height="6" rx="3" fill="rgba(255,255,255,0.28)"/>
      <rect x="10" y="60" width="60" height="5" rx="2.5" fill="rgba(255,255,255,0.14)"/>

      <!-- Selected sidebar item -->
      <rect x="6" y="82" width="118" height="24" rx="6" fill="rgba(255,255,255,0.08)"/>
      <rect x="16" y="91" width="72" height="6" rx="3" fill="rgba(255,255,255,0.55)"/>

      <rect x="10" y="120" width="86" height="6" rx="3" fill="rgba(255,255,255,0.14)"/>
      <rect x="10" y="138" width="72" height="6" rx="3" fill="rgba(255,255,255,0.14)"/>
      <rect x="10" y="156" width="90" height="6" rx="3" fill="rgba(255,255,255,0.14)"/>
      <rect x="10" y="174" width="66" height="6" rx="3" fill="rgba(255,255,255,0.14)"/>
      <rect x="10" y="192" width="82" height="6" rx="3" fill="rgba(255,255,255,0.14)"/>
      <rect x="10" y="210" width="70" height="6" rx="3" fill="rgba(255,255,255,0.14)"/>
      <rect x="10" y="228" width="88" height="6" rx="3" fill="rgba(255,255,255,0.14)"/>

      <!-- Main Content Area with Exit Flow -->
      <rect x="150" y="52" width="170" height="14" rx="4" fill="rgba(255,255,255,0.42)"/>
      <rect x="150" y="74" width="110" height="8" rx="3" fill="rgba(255,255,255,0.2)"/>

      <rect x="150" y="104" width="270" height="6" rx="3" fill="rgba(255,255,255,0.12)"/>
      <rect x="150" y="118" width="250" height="6" rx="3" fill="rgba(255,255,255,0.12)"/>
      <rect x="150" y="132" width="270" height="6" rx="3" fill="rgba(255,255,255,0.12)"/>

      <!-- Exit Card centered in lower portion -->
      <g transform="translate(160, 164)">
        <rect x="0" y="0" width="250" height="74" rx="12" fill="rgba(255, 95, 86, 0.08)" stroke="#FF5F56" stroke-width="1.2"/>
        <circle cx="36" cy="37" r="18" fill="#FF5F56" opacity="0.18"/>
        <!-- Arrow leaving cleanly -->
        <path d="M 28 37 L 44 37 M 38 31 L 44 37 L 38 43" fill="none" stroke="#FF5F56" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="66" y="32" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">Last Window Closed</text>
        <text x="66" y="52" fill="#FF5F56" font-family="ui-monospace, monospace" font-size="11" font-weight="600">Terminating app gracefully...</text>
      </g>
    </g>

    <!-- Traffic lights: red is highlighted (click ripple + glow) -->
    <circle cx="20" cy="15" r="17" fill="none" stroke="#FF5F56" stroke-width="1.25" stroke-dasharray="3 3" opacity="0.55"/>
    <circle cx="20" cy="15" r="24" fill="none" stroke="#FF5F56" stroke-width="1" stroke-dasharray="4 5" opacity="0.25"/>

    <g filter="url(#le-red-glow-feat)">
      <circle cx="20" cy="15" r="7" fill="url(#le-red-btn-feat)"/>
      <circle cx="20" cy="15" r="7" fill="none" stroke="rgba(0,0,0,0.25)" stroke-width="0.5"/>
      <ellipse cx="18" cy="12.5" rx="2.8" ry="1.4" fill="rgba(255,255,255,0.55)"/>
    </g>

    <circle cx="40" cy="15" r="5" fill="#FFBD2E"/>
    <circle cx="56" cy="15" r="5" fill="#27C93F"/>

    <!-- Cursor pointer near red button - RENDERED ON TOP TO ELIMINATE ARTIFACTS -->
    <g transform="translate(28, 22)" opacity="0.95" filter="url(#le-cursor-shadow-feat)">
      <path d="M 0 0 L 0 13 L 3.3 10 L 6 15 L 7.8 14.2 L 5 9.1 L 9.3 8.7 Z" fill="#FFFFFF" stroke="#1A1A1E" stroke-width="0.9" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
