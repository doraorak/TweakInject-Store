<svg id="lastexit-app-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Canvas background: soft cool gray gradient matching Vanish -->
    <linearGradient id="le-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F5F7"/>
      <stop offset="100%" stop-color="#DDDCE1"/>
    </linearGradient>

    <!-- Fine grid overlay -->
    <pattern id="le-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(0, 0, 0, 0.035)" stroke-width="1"/>
    </pattern>

    <!-- Ambient glow behind window -->
    <radialGradient id="le-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FF5F56" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#FF5F56" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FF5F56" stop-opacity="0"/>
    </radialGradient>

    <!-- Window body gradient with smooth lighting -->
    <linearGradient id="le-win-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#28282B"/>
      <stop offset="100%" stop-color="#161618"/>
    </linearGradient>

    <!-- Exit Portal gradient -->
    <linearGradient id="le-portal-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#232326"/>
      <stop offset="100%" stop-color="#19191C"/>
    </linearGradient>

    <!-- Exit arrow vibrant gradient -->
    <linearGradient id="le-exit-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="50%" stop-color="#FF3B30"/>
      <stop offset="100%" stop-color="#FF2D55"/>
    </linearGradient>

    <!-- Soft window shadow -->
    <filter id="le-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.28"/>
    </filter>

    <!-- Exit arrow neon glow -->
    <filter id="le-exit-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#FF3B30" flood-opacity="0.55"/>
    </filter>

    <!-- Red button radial highlight -->
    <radialGradient id="le-red-btn" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#FF9188"/>
      <stop offset="55%" stop-color="#FF5F56"/>
      <stop offset="100%" stop-color="#C22B22"/>
    </radialGradient>

    <!-- Red button glow -->
    <filter id="le-red-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FF5F56" flood-opacity="0.8"/>
    </filter>

    <clipPath id="le-win-clip">
      <rect x="76" y="86" width="360" height="340" rx="38"/>
    </clipPath>
  </defs>

  <!-- Base canvas + grid -->
  <rect width="512" height="512" fill="url(#le-bg)"/>
  <rect width="512" height="512" fill="url(#le-grid)"/>

  <!-- Ambient background glow -->
  <circle cx="256" cy="256" r="240" fill="url(#le-glow)"/>

  <!-- Concentric echo rings (connecting Vanish and LastExit design language) -->
  <circle cx="256" cy="256" r="232" fill="none" stroke="#FF5F56" stroke-width="1.2" stroke-dasharray="2 6" opacity="0.16"/>
  <circle cx="256" cy="256" r="204" fill="none" stroke="#FF5F56" stroke-width="1.4" stroke-dasharray="3 5" opacity="0.22"/>

  <!-- Main Window Frame with extra-rounded corners (rx=38) -->
  <g filter="url(#le-shadow)">
    <!-- Outer window border -->
    <rect x="76" y="86" width="360" height="340" rx="38" fill="url(#le-win-grad)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

    <!-- Clipped window contents -->
    <g clip-path="url(#le-win-clip)">
      <!-- Titlebar separator -->
      <line x1="76" y1="148" x2="436" y2="148" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

      <!-- Portal / Exit Gateway inside window -->
      <rect x="176" y="180" width="160" height="176" rx="22" fill="url(#le-portal-grad)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
      <rect x="184" y="188" width="144" height="160" rx="16" fill="rgba(0,0,0,0.25)" stroke="rgba(255,95,86,0.12)" stroke-width="1"/>

      <!-- Motion trail behind the arrow -->
      <path d="M 216 300 L 216 280" fill="none" stroke="#FF5F56" stroke-width="3" stroke-dasharray="2 4" stroke-linecap="round" opacity="0.5"/>

      <!-- Radiant curved exit arrow escaping outward -->
      <g filter="url(#le-exit-glow)">
        <!-- Smooth curved trajectory -->
        <path d="M 218 296 L 218 252 C 218 238, 230 228, 246 228 L 278 228" fill="none" stroke="url(#le-exit-grad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Arrowhead -->
        <path d="M 270 214 L 298 228 L 270 242 Z" fill="url(#le-exit-grad)"/>
      </g>

      <!-- Extinguished Dock Indicator Dot at bottom center -->
      <g transform="translate(244, 386)">
        <circle cx="12" cy="12" r="8" fill="none" stroke="#FF5F56" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.5"/>
        <circle cx="12" cy="12" r="3.5" fill="#FF5F56" opacity="0.85"/>
      </g>
    </g>

    <!-- Titlebar buttons rendered crisp on top -->
    <!-- Traffic lights: Red is active & glowing, matching Vanish -->
    <circle cx="114" cy="117" r="15" fill="none" stroke="#FF5F56" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.5"/>
    <g filter="url(#le-red-glow)">
      <circle cx="114" cy="117" r="8" fill="url(#le-red-btn)"/>
      <ellipse cx="112" cy="114" rx="3" ry="1.4" fill="rgba(255,255,255,0.6)"/>
    </g>
    <circle cx="140" cy="117" r="6" fill="#FFBD2E"/>
    <circle cx="164" cy="117" r="6" fill="#27C93F"/>

    <!-- Window title bar capsule -->
    <rect x="220" y="112" width="90" height="10" rx="5" fill="rgba(255,255,255,0.12)"/>
  </g>
</svg>
