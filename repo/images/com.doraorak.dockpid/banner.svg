<svg id="dockpid-store-banner" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
        <defs>
          <!-- Background Gradient: Sequoia Golden Gate theme -->
          <linearGradient id="banner-bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#c1b29c"></stop>
            <stop offset="100%" stop-color="#a89983"></stop>
          </linearGradient>
          
          <!-- Ambient Glow: Matching Golden Gate Sequoia -->
          <radialGradient id="glow-mask" cx="80%" cy="50%" r="60%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"></stop>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"></stop>
          </radialGradient>
          
          <!-- Darker Grid Pattern for Light Background -->
          <pattern id="banner-grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#000000" stroke-opacity="0.03" stroke-width="1"></path>
          </pattern>
          
          <!-- Shadows -->
          <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.2"></feDropShadow>
          </filter>
          
          <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur"></feGaussianBlur>
            <feComposite in="SourceGraphic" in2="blur" operator="over"></feComposite>
          </filter>
        </defs>

        <!-- Background Base -->
        <rect width="1200" height="400" fill="url(#banner-bg)"></rect>
        <rect width="1200" height="400" fill="url(#banner-grid)"></rect>
        <circle cx="900" cy="200" r="350" fill="url(#glow-mask)"></circle>

        <!-- Branding & Info (Left Column - shifted higher to avoid card collision) -->
        <g transform="translate(80, 42)">
          <!-- Tag/Eyebrow -->
          <text x="0" y="24" fill="#2C2C35" font-family="ui-monospace, 'IBM Plex Mono', 'JetBrains Mono', Menlo, monospace" font-size="12" font-weight="700" letter-spacing="3">TWEAKINJECT EXCLUSIVE</text>
          
          <!-- Title -->
          <text x="0" y="80" fill="#1A1C23" font-family="-apple-system, system-ui, sans-serif" font-size="54" font-weight="800" letter-spacing="-1">DockPID</text>
          
          <!-- Tagline (Secondary title with 'identifiers') -->
          <text x="0" y="116" fill="#3E424F" font-family="-apple-system, system-ui, sans-serif" font-size="18" font-weight="500">Process identifiers, embedded in your macOS Dock.</text>

          <!-- Bullets -->
          <g transform="translate(0, 150)">
            <!-- Bullet 1: Floating process PIDs (no HUD) -->
            <circle cx="6" cy="14" r="3.5" fill="#2C2C35"></circle>
            <text x="20" y="18" fill="#3E424F" font-family="ui-monospace, 'IBM Plex Mono', 'JetBrains Mono', Menlo, monospace" font-size="13">Floating process PIDs</text>
            
            <!-- Bullet 2: Custom display styles (no "rules and") -->
            <circle cx="6" cy="44" r="3.5" fill="#2C2C35"></circle>
            <text x="20" y="48" fill="#3E424F" font-family="ui-monospace, 'IBM Plex Mono', 'JetBrains Mono', Menlo, monospace" font-size="13">Custom display styles</text>
          </g>
        </g>

        <!-- Isometric / Perspective Desktop Mockup (Right Column) -->
        <g transform="translate(700, 20)">
          <!-- Desktop Frame -->
          <rect x="0" y="0" width="420" height="280" rx="16" fill="#18181B" stroke="rgba(255,255,255,0.08)" stroke-width="2" filter="url(#card-shadow)"></rect>
          <!-- Screen Content Area -->
          <rect x="8" y="8" width="404" height="264" rx="10" fill="#0A0B0E"></rect>
          
          <!-- Ambient wallpaper glow inside screen -->
          <path d="M 8 200 Q 150 120 300 180 T 412 100 L 412 272 L 8 272 Z" fill="rgba(193, 178, 156, 0.08)"></path>

          <!-- Mockup Dock -->
          <rect x="72" y="224" width="276" height="36" rx="18" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255,255,255,0.12)" stroke-width="1"></rect>
          
          <!-- Mockup Icons -->
          <!-- Finder -->
          <rect x="90" y="231" width="22" height="22" rx="4" fill="#3B82F6"></rect>
          <!-- Safari -->
          <circle cx="131" cy="242" r="11" fill="#1D4ED8"></circle>
          <!-- Terminal -->
          <rect x="160" y="231" width="22" height="22" rx="4" fill="#1F2937"></rect>
          
          <!-- Active App (DockPID) -->
          <rect x="195" y="231" width="22" height="22" rx="4" fill="#0D0D0F" stroke="#c1b29c" stroke-width="1.5"></rect>
          <!-- Active Indicator dot -->
          <circle cx="206" cy="256" r="1.5" fill="#c1b29c"></circle>
          
          <!-- VS Code -->
          <rect x="230" y="231" width="22" height="22" rx="4" fill="#4F46E5"></rect>
          <!-- Slack -->
          <rect x="265" y="231" width="22" height="22" rx="4" fill="#EC4899"></rect>
          <!-- System Settings -->
          <rect x="300" y="231" width="22" height="22" rx="4" fill="#6B7280"></rect>

          <!-- Connecting pointer dotted line -->
          <path d="M 206 231 L 206 186 C 206 186 216 146 250 146" fill="none" stroke="#c1b29c" stroke-dasharray="2 2" stroke-width="1.5" opacity="0.7"></path>
          <circle cx="206" cy="231" r="2.5" fill="#c1b29c"></circle>
          <circle cx="250" cy="146" r="2.5" fill="#c1b29c"></circle>

          <!-- Floating PID Badge on desktop (Gray style matching the icon's gray tooltip bubble) -->
          <g filter="url(#soft-glow)">
            <rect x="250" y="116" width="110" height="48" rx="8" fill="#2C2C35" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"></rect>
            <text x="305" y="132" fill="rgba(255, 255, 255, 0.5)" font-family="ui-monospace, 'IBM Plex Mono', 'JetBrains Mono', Menlo, monospace" font-size="9" font-weight="700" letter-spacing="2" text-anchor="middle">PID</text>
            <text class="banner-pid-val" x="305" y="153" fill="#FFF" font-family="ui-monospace, 'IBM Plex Mono', 'JetBrains Mono', Menlo, monospace" font-size="18" font-weight="700" text-anchor="middle">8492</text>
          </g>
        </g>
      </svg>