<svg id="preferenceloader-app-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
          <defs>
            <!-- Background Gradient -->
            <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#1E2235"/>
              <stop offset="100%" stop-color="#0F111A"/>
            </linearGradient>

            <!-- Tech Grid Pattern -->
            <pattern id="gridPattern" width="32" height="32" patternUnits="userSpaceOnUse">
              <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255, 255, 255, 0.02)" stroke-width="1"/>
            </pattern>

            <!-- Gear Drop Shadow -->
            <filter id="gearShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
            </filter>

            <!-- Unified Gear Metal Gradient (aligned to the gear bounding box from y=76 to y=436) -->
            <linearGradient id="gearGrad" x1="0%" y1="76" x2="0%" y2="436" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#F3F4F6"/>
              <stop offset="30%" stop-color="#E5E7EB"/>
              <stop offset="70%" stop-color="#D1D5DB"/>
              <stop offset="100%" stop-color="#9CA3AF"/>
            </linearGradient>

            <!-- Gear Shape Mask: Defines the complete silhouette of the gear including teeth and center cutout -->
            <mask id="gearShapeMask" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
              <!-- Default is transparent black -->
              <rect x="0" y="0" width="512" height="512" fill="black"/>
              <!-- Gear geometry in solid white -->
              <g fill="white">
                <rect x="232" y="76" width="48" height="70" rx="10"/>
                <rect x="232" y="76" width="48" height="70" rx="10" transform="rotate(45 256 256)"/>
                <rect x="232" y="76" width="48" height="70" rx="10" transform="rotate(90 256 256)"/>
                <rect x="232" y="76" width="48" height="70" rx="10" transform="rotate(135 256 256)"/>
                <rect x="232" y="76" width="48" height="70" rx="10" transform="rotate(180 256 256)"/>
                <rect x="232" y="76" width="48" height="70" rx="10" transform="rotate(225 256 256)"/>
                <rect x="232" y="76" width="48" height="70" rx="10" transform="rotate(270 256 256)"/>
                <rect x="232" y="76" width="48" height="70" rx="10" transform="rotate(315 256 256)"/>
                <circle cx="256" cy="256" r="130"/>
              </g>
              <!-- Subtract the center hole -->
              <circle cx="256" cy="256" r="64" fill="black"/>
            </mask>
          </defs>

          <!-- Base Square Canvas (no pre-clipping) -->
          <rect width="512" height="512" fill="url(#bgGrad)"/>
          
          <!-- Subtle inner grid pattern -->
          <rect width="512" height="512" fill="url(#gridPattern)"/>

          <!-- Ambient soft background illumination -->
          <circle cx="256" cy="256" r="160" fill="#E5E7EB" opacity="0.03" filter="blur(24px)"/>

          <!-- ================= SIMPLIFIED GRAY GEAR ================= -->
          <!-- Rendered as a single unified rect with the non-rotating gear gradient, masked to the shape -->
          <g filter="url(#gearShadow)">
            <rect x="76" y="76" width="360" height="360" fill="url(#gearGrad)" mask="url(#gearShapeMask)"/>
          </g>

          <!-- Cutout Overlay: Circle higher on the z-index to block any gear shadow or parts inside the hole -->
          <circle cx="256" cy="256" r="64" fill="url(#bgGrad)"/>
          <circle cx="256" cy="256" r="64" fill="url(#gridPattern)"/>

          <!-- Outer boundary crisp edge ring for inner hole -->
          <circle cx="256" cy="256" r="64" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2"/>
          <circle cx="256" cy="256" r="65" fill="none" stroke="rgba(0, 0, 0, 0.15)" stroke-width="1"/>
        </svg>